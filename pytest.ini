[pytest]
minversion = 7.0
testpaths = regreg
python_files = test_*.py
addopts =
    --import-mode=importlib
    -ra
    --strict-markers
markers =
    slow: slow tests (skipped unless --runslow is given)
    rpy2: tests that compare against R via rpy2 (skipped if rpy2/R unavailable)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::SyntaxWarning
    ignore:unable to import isotonic regression:UserWarning
