# Build the Jupyter Book in doc/ and the Sphinx API reference, and deploy
# them to GitHub Pages. Runs only when triggered by hand (Actions -> Docs ->
# Run workflow, or `gh workflow run docs.yml`).
# Deploying requires Settings -> Pages -> Source: "GitHub Actions".

name: Docs
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag or commit to build docs from'
        required: true
        default: 'main'
        type: string

env:
  # `BASE_URL` determines where the website is served from, including CSS & JS assets
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag_name }}
          fetch-depth: 0 # setuptools_scm needs the tags

      # Jupyter Book 2 runs on Node
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and documentation tools
        run: |
          pip install --upgrade pip
          pip install ".[doc]"

      # The pages are executed; --strict makes a cell that raises (e.g. a failed
      # numerical check) fail the build
      - name: Build HTML
        run: |
          cd doc
          jupyter-book build --html --execute --strict

      # The API reference: Sphinx autodoc, into api/ next to the book
      - name: Build API reference
        run: |
          sphinx-build -b html doc/api doc/_build/html/api
          test -f doc/_build/html/api/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'doc/_build/html'

  deploy:
    needs: build
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the
    # run in progress and the latest queued. Do NOT cancel in-progress runs, so
    # that production deployments complete.
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
