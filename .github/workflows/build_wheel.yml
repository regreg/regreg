# Build wheels and the sdist. Pushing a tag ``v*`` also uploads them to PyPI;
# running the workflow by hand uploads them to TestPyPI. Both uploads use
# trusted publishing (no API token): the PyPI and TestPyPI projects must list
# this repository, this workflow file and the environment (``pypi`` or
# ``testpypi``) as a trusted publisher.

name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm needs the tags

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl # cibuildwheel puts wheels in this directory

  build_windows_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm needs the tags

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          # Only build 64-bit wheels (skips the broken win32 build)
          CIBW_ARCHS: auto64

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl # cibuildwheel puts wheels in this directory

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # setuptools_scm needs the tags

    - name: Build SDist
      run: pipx run build --sdist

    - uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz

  upload_to_pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheels, build_windows_wheels, make_sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/regreg/
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare dist directory
        run: |
          mkdir -p dist
          find artifacts -name "*.whl" -exec cp {} dist/ \;
          find artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          ls -la dist/

      - name: Check package distributables
        run: pipx run twine check --strict dist/*

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  upload_to_test_pypi:
    name: Upload to TestPyPI
    runs-on: ubuntu-latest
    needs: [build_wheels, build_windows_wheels, make_sdist]
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/regreg/
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare dist directory
        run: |
          mkdir -p dist
          find artifacts -name "*.whl" -exec cp {} dist/ \;
          find artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          ls -la dist/

      - name: Check package distributables
        run: pipx run twine check --strict dist/*

      - name: Upload to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
